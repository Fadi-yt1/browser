name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and typecheck gateway
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install and build web client
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Validate compose file
        run: docker compose config -q

      - name: Shell script syntax
        run: bash -n scripts/*.sh browser-image/entrypoint.sh

  local-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install session dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc openbox xdotool xclip x11-utils chromium-browser || \
          sudo apt-get install -y -qq xvfb x11vnc openbox xdotool xclip x11-utils

      - name: Build
        run: |
          (cd server && npm install --no-audit --no-fund && npm run build)
          (cd web && npm install --no-audit --no-fund && npm run build)

      - name: Launch a real session end to end
        env:
          SESSION_RUNTIME: local
          SESSION_SECRET: citest
          PORT: "8080"
          MAX_CONCURRENT_SESSIONS: "1"
        run: |
          node server/dist/index.js &
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          body=$(curl -sf -X POST localhost:8080/api/sessions \
            -H 'content-type: application/json' \
            -d '{"width":1024,"height":700,"url":"http://127.0.0.1:8080"}')
          echo "$body"
          id=$(echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).session.id))")
          token=$(echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).token))")
          curl -sf -H "x-session-token: $token" "localhost:8080/api/sessions/$id/state"
          curl -sf -X DELETE -H "x-session-token: $token" "localhost:8080/api/sessions/$id" -o /dev/null -w 'teardown %{http_code}\n'

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build session image
        run: docker build -t browser-in-browser/session:ci ./browser-image
      - name: Build gateway image
        run: docker build -t browser-in-browser/gateway:ci .
      - name: Boot the session image and check the control agent answers
        run: |
          docker run -d --name smoke --init --shm-size=512m \
            -p 127.0.0.1:6070:6070 -e VNC_PASSWORD=citest \
            browser-in-browser/session:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:6070/healthz; then echo "agent up"; exit 0; fi
            sleep 2
          done
          echo "agent never came up"; docker logs smoke; exit 1
